# server configuration
server: 
  source: 'mysql'
  host: "10.168.51.196"
  port: 3306
  user: 'unified'
  password: 'unified'

# setup progress log
progress_log: 
  folder: 'logs/progress'
  files:
    finished: 'logs/progress/label_metadata.xlsx'
    unfinished: 'logs/progress/unlabel_metadata.xlsx'

# define model to perform spam detection
models: 
  text_embedding:
    model_name: "jinaai/jina-embeddings-v3"
  initial_data_filepath: './data/initialization.xlsx'
 
# quert to select subdata
data: 
  query: 
    'WITH StratifiedData AS (
    SELECT
        id,
        current_datetime,
        payload, 
        ROW_NUMBER() OVER (
            PARTITION BY HOUR(current_datetime)
            ORDER BY RAND()
        ) as rn
    FROM
        sms_spam_cd.data_tdr_spam_filter 
    where	
    	day(current_datetime) in ({})
    ) 
    SELECT
        id,
        current_datetime,
        payload
    FROM
        StratifiedData
    WHERE
        rn <= {}'
  column_name: ['id', 'datetime', 'payload']
  target_column: 'payload' # specific the main column that listed in `column_name`
  metadata_column: ['id', 'datetime']

# define population data's metadata
metadata:
  query: 
    'SELECT DISTINCT
      YEAR(current_datetime), 
      MONTH(current_datetime), 
      DAY(current_datetime), 
      HOUR(current_datetime)
    FROM 
      sms_spam_cd.data_tdr_spam_filter'
  column_name: ['year', 'month', 'day', 'hour'] 
 
# define where vectorstores locate
vectorstore:
  directory: './data/vector'
  filename: 'sms_embeddings'

# define experiment and model name for this project
mlflow_config:
  experiment_name: 'SMS SPAM DETECTION'

pseudo_query: 
  "select 
    mr.id,
    mr.datetime,
    data.payload,
    mr.spam_label
  from 
    sms_spam_cd.metadata_result mr 
    inner join sms_spam_cd.data_tdr_spam_filter data on mr.id = data.id 
  where
    mr.label_status = 1"

human_query:
  "select 
    mr.id,
    mr.datetime,
    data.payload,
    mr.spam_label
  from 
    sms_spam_cd.metadata_result mr 
    inner join sms_spam_cd.data_tdr_spam_filter data on mr.id = data.id 
  where
    mr.label_status = -1"