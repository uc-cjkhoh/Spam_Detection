mlflow_uri: 'http://10.168.49.12:5000'
experiment_name: 'initial_data+new_initial_data_V2'

label_column: 'spam_label'
target_column: 'payload'
number_of_uncertain: 500
confidence_score_threshold: 0.98
similarity_threshold: 0.90
 
database:
  host: '10.168.51.196'
  port: 3306
  user: 'unified'
  password: 'unified'
  table_schema: 'sms_spam_cd'
  table_to_save_result: 'label_by_vectordb'

 
embedding:
  model_name: 'sentence-transformers/all-MiniLM-L6-v2'
  batch_size: 8
  normalize_embeddings: True
  show_progress: True

 
ml_model:
  model_name: 'lightgbm_model'

 
vectorstore:
  directory: './data/vector'

 
initial_data: 
  'select 
    payload,
    spam_label_update as spam_label
  from 
    sms_spam_cd.new_initial_data
  where 
    day(datetime) != 6
  UNION ALL
  select 
    payload,
    spam_label
  from
    sms_spam_cd.initial_data
  where
    day(datetime) != 22
  '

 
test_data:
  'select 
    payload,
    spam_label_update as spam_label
  from 
    sms_spam_cd.new_initial_data
  where 
    day(datetime) = 6
  UNION ALL
  select 
    payload,
    spam_label
  from
    sms_spam_cd.initial_data
  where
    day(datetime) = 22
  '

 
labeled_data: 
  "select 
    data.payload,
    mr.spam_label
  from 
    sms_spam_cd.metadata_result mr 
    inner join sms_spam_cd.data_tdr_spam_filter data on mr.id = data.id 
  where
    mr.label_status in (-1)
  "
 
 
stratified_sampling: 
  'WITH StratifiedData AS (
    SELECT
      id,
      current_datetime,
      payload, 
      ROW_NUMBER() OVER (
          PARTITION BY day(current_datetime), HOUR(current_datetime)
          ORDER BY RAND()
      ) as rn
    FROM
        sms_spam_cd.data_tdr_spam_filter 
    where
      YEAR(current_datetime) = 2026
      AND DAY(current_datetime) = 6
  )
  SELECT
    id,
    current_datetime,
    payload
  FROM
    StratifiedData
  WHERE
    rn <= 100' 